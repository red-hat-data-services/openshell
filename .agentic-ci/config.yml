# agentic-ci configuration for autofix runs on this repository.
#
# `sandbox:` is a repo overlay for the agentic-ci sandbox profile (see
# https://github.com/opendatahub-io/agentic-ci, docs/sandbox-profiles.md).
# autofix reads it from the base branch before the agent runs. An overlay
# may set toolchains, setup, validate, skips and env, and open only the
# goproxy, npm and pypi egress presets; anything wider is configured
# centrally in autofix.
#
# Toolchains come from the agentic-ci catalog at the versions pinned in
# mise.toml (python reads .python-version). If an upstream sync bumps a
# version in mise.toml, bump it here too: mise does not install it, so
# the validate steps fail until the pins match. Setup installs mise from
# npm, links the catalog toolchains into mise so it never downloads
# them, and installs the mise npm/go tools through the presets. Rust and
# container, cluster and VM tasks cannot run in the sandbox and are
# declared as skips.

sandbox:
  toolchains:
    python: auto  # reads .python-version
    node: "24.15.0"
    go: "1.26.7"
    buf: "1.72.0"
    helm: "4.2.0"

  egress:
    - goproxy
    - npm
    - pypi

  env:
    MISE_YES: "1"
    MISE_AUTO_INSTALL: "false"
    MISE_DISABLE_TOOLS: "rust,kubectl,uv,protoc,helm-docs,yq,skaffold,k3d,zig,github:anchore/syft,github:EmbarkStudios/cargo-about,github:EmbarkStudios/cargo-deny,github:rust-secure-code/cargo-auditable,github:nextest-rs/nextest,github:rust-cross/cargo-zigbuild,github:mozilla/sccache"

  setup:
    - name: mise
      timeout: 900
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=x64 ;;
          aarch64) arch=arm64 ;;
          *) echo "unsupported machine: $(uname -m)" >&2; exit 1 ;;
        esac
        # Keep in sync with min_version in mise.toml.
        npm install --prefix "$HOME/.local/share/mise-npm" --no-audit --no-fund \
          "@jdxcode/mise-linux-${arch}@2026.9.9"
        mkdir -p "$HOME/.local/bin"
        ln -sf "$HOME/.local/share/mise-npm/node_modules/@jdxcode/mise-linux-${arch}/bin/mise" \
          "$HOME/.local/bin/mise"
        export PATH="$HOME/.local/bin:$PATH"
        mise trust
        # Link the catalog toolchains into mise under the versions they
        # report, so the versions are pinned only in `toolchains` above.
        root() { dirname "$(dirname "$(command -v "$1")")"; }
        mise link "go@$(go env GOVERSION | sed 's/^go//')" "$(root go)"
        mise link "node@$(node --version | sed 's/^v//')" "$(root node)"
        mise link "python@$(python3 -c 'import platform; print(platform.python_version())')" \
          "$(root python3)"
        mise link "buf@$(buf --version)" "$(root buf)"
        mise link "helm@$(helm version --template '{{.Version}}' | sed 's/^v//')" \
          "$(dirname "$(command -v helm)")"
        mise install \
          npm:markdownlint-cli2 \
          go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint \
          go:google.golang.org/protobuf/cmd/protoc-gen-go \
          go:google.golang.org/grpc/cmd/protoc-gen-go-grpc \
          go:golang.org/x/tools/cmd/goimports

  validate:
    - {name: python-lint, kind: lint, run: mise run python:lint, timeout: 600}
    - {name: python-format, kind: lint, run: mise run python:format:check, timeout: 600}
    - {name: markdown-lint, kind: lint, run: mise run markdown:lint:md, timeout: 600}
    - {name: proto-lint, kind: lint, run: mise run proto:lint, timeout: 600}
    - {name: helm-lint, kind: lint, run: mise run helm:lint, timeout: 600}
    - {name: go-format, kind: lint, run: mise run go:format:check, timeout: 600}
    - {name: go-lint, kind: lint, run: mise run go:lint, timeout: 900}

  skips:
    - match: "rust:*, cargo, clippy, nextest, cargo-deny"
      reason: "No Rust toolchain or C compiler in the sandbox, so Rust builds, tests, lints and dependency checks rely on CI"
    - match: "docker:*, gateway:*, sandbox:*, vm:*, package:*"
      reason: "Image, VM and package builds need a container runtime or privileged features the sandbox blocks"
    - match: "e2e:*, test:*, helm:test"
      reason: "End-to-end and cluster tests need a container runtime, a running gateway or a live cluster"
    - match: "license:check"
      reason: "Fails on main today: midstream files such as .tekton/*.yaml have no SPDX header"
