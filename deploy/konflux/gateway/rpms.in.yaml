# RPM dependencies for Containerfile.gateway.konflux
# Build + runtime stages combined. Generate lockfile with:
#   rpm-lockfile-prototype --image registry.redhat.io/ubi9/ubi:9.6 \
#       --arch x86_64 --arch aarch64 \
#       deploy/konflux/gateway/rpms.in.yaml \
#       > deploy/konflux/gateway/rpms.lock.yaml
packages:
  # Build stage: Rust toolchain
  - rust
  - cargo
  # Build stage: C/C++ toolchain
  - gcc
  - gcc-c++
  - make
  - cmake
  # Build stage: gcc-toolset-14 for C++20 <format> (required by bundled Z3)
  - gcc-toolset-14
  - gcc-toolset-14-gcc-c++
  # Build stage: z3-sys bindgen needs libclang
  - clang-devel
  # Build stage: other
  - openssl-devel
  - git-core
  # Runtime stage
  - ca-certificates
